name: CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test & Lint Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Check code formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy Linter
        run: cargo clippy --all-targets -- -D warnings

      - name: Run Test Suite
        run: cargo test --all-targets --verbose

      - name: Run CLI against Fixtures
        run: |
          cargo run -- tests/fixtures/Dockerfile.optimized
          # Vulnerable Dockerfile should fail with policy flag
          cargo run -- tests/fixtures/Dockerfile.vulnerable --fail-on high || true
